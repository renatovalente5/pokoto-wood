# As baterias do site: as regras dos dados e o «caminho do cliente» (cada mudança que o painel
# pode fazer ao conteúdo, com o gerador a correr sobre o resultado). Correm só quando muda o
# código — as gravações do painel mexem em content/ e media/ e não precisam de esperar por elas.
name: Testes

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'src/**', '.github/workflows/testes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: As regras dos dados
        run: node scripts/testar-regras.mjs
      - name: As imagens (o caminho do cliente gera o site sem as refazer)
        run: python scripts/imagens.py
      - name: O caminho do cliente
        run: node scripts/testar-caminhos.mjs
