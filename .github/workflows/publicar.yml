# Constrói o site da Pokóto Wood e publica-o na Cloudflare, em https://pokotowood.pt.
#
# O site é o Worker «pokoto-wood-site» (wrangler.jsonc): os ficheiros que o
# `node scripts/build.mjs --producao` escreve em _site/, nos Custom Domains pokotowood.pt e
# www.pokotowood.pt (o www vai para o domínio sem www: worker/www.js). A construção de produção
# abre aos motores de busca e RECUSA publicar enquanto faltar um dado legal (NIF, morada,
# WhatsApp, prazos, pagamento, IVA).
#
# Até 11 out 2026 publicava a pré-visualização no GitHub Pages (renatovalente5.github.io/pokoto-wood,
# construída com --base=/pokoto-wood, fechada aos motores de busca). Os termos do Pages não deixam
# lá uma loja, e a pré-visualização acabou com o domínio.
#
# O PAINEL (renatovalente5/pokoto-painel) acompanha este workflow: o job «publicar» acabado bem
# quer dizer «publicado»; o nome do passo que falha aparece à dona (por isso os nomes são em
# português); as razões de uma publicação parada são as anotações ::error do build. O ensaio do
# painel corre ESTE ficheiro (scripts/lib/ci-de-ensaio.mjs) e as baterias dele conferem os nomes
# dos passos (scripts/lib/github-de-ensaio.mjs): mudar um nome aqui é mudá-lo lá.
#
# Precisa do segredo CLOUDFLARE_API_TOKEN e da variável CLOUDFLARE_ACCOUNT_ID. O token é do
# Renato, com Account › Workers Scripts: Edit e Account › Account Settings: Read, e NADA das
# zonas: os Custom Domains ligaram-se uma vez, à mão (11 out 2026), e este workflow publica sem
# rotas (ver o passo «Preparar o site»). Sem o token a publicação FALHA, de propósito: melhor um
# CI vermelho do que edições que nunca chegam ao site.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todos os dias às 00:15 de Lisboa (23:15 UTC no inverno): as promoções e o aviso do topo
  # têm data de fim, e o site só muda quando se publica.
  schedule:
    - cron: '15 23 * * *'

permissions: {}

# Uma publicação nova cancela a que está a correr: publica-se sempre o commit mais recente.
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a data de cada página no sitemap sai do histórico do git
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Guardar as imagens entre publicações
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/imagens
          key: imagens-${{ hashFiles('media/**', 'scripts/imagens.py', 'content/produtos/*.json') }}
          restore-keys: imagens-
      - name: Conferir as fotografias
        run: python scripts/imagens.py --verificar
      - name: Construir
        run: node scripts/build.mjs --producao
      # O que o job «publicar» precisa, num ficheiro só: o site, o script do www e a
      # configuração do Worker. O job «publicar» não faz checkout: nenhum código do
      # repositório corre ao lado do token.
      - name: Embrulhar o site
        run: tar -czf site.tgz _site worker/www.js wrangler.jsonc
      - name: Guardar o site construído
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: site.tgz
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Buscar o site construído
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
      - name: Preparar o site
        run: |
          set -euo pipefail
          # O artefacto: só o site.tgz.
          test "$(ls -A)" = "site.tgz" || { echo "o artefacto traz mais do que o site.tgz: $(ls -A | tr '\n' ' ')"; exit 1; }
          # O embrulho, antes de o abrir: nada de caminhos absolutos nem «..», só ficheiros e
          # pastas (nada de ligações nem ficheiros especiais), e só o site, o script do www e a
          # configuração. Para ficheiros e só depois o grep: um grep -q a meio de um pipe deixava
          # o tar a morrer de SIGPIPE, e o if lia isso como «limpo».
          tar -tzf site.tgz > nomes.txt
          tar -tvzf site.tgz > tipos.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' nomes.txt; then echo "caminhos proibidos no embrulho"; exit 1; fi
          if grep -Evq '^[-d]' tipos.txt; then echo "ligações ou ficheiros especiais no embrulho"; grep -Ev '^[-d]' tipos.txt; exit 1; fi
          outros="$(grep -Ev '^(\./)?(_site(/.*)?|worker/?|worker/www\.js|wrangler\.jsonc)$' nomes.txt || true)"
          if [ -n "$outros" ]; then echo "o embrulho traz mais do que _site/, worker/www.js e wrangler.jsonc:"; echo "$outros" | head -20; exit 1; fi
          rm nomes.txt tipos.txt
          tar -xzf site.tgz && rm site.tgz
          test -f _site/index.html || { echo "FALTA _site/index.html"; exit 1; }
          test -f _site/404.html   || { echo "FALTA _site/404.html"; exit 1; }
          test -z "$(find _site -name '*.md')" || { echo ".md NÃO devia ser publicado"; exit 1; }
          # A configuração do Worker SEM as rotas: os Custom Domains (pokotowood.pt e o www)
          # ficam ligados ao Worker, e um deploy sem rotas não lhes toca (provado a 11 out 2026:
          # «No targets deployed», e os dois continuaram lá). Assim o token só publica Workers.
          # Os comentários do wrangler.jsonc são linhas inteiras (é o que isto tira).
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            if (c.name !== "pokoto-wood-site" || c.assets?.directory !== "./_site") throw new Error("o wrangler.jsonc não é o do site");
            delete c.routes;
            fs.writeFileSync("wrangler.json", JSON.stringify(c, null, 2) + "\n");
          '
          cat wrangler.json
          echo "ok: $(find _site -type f | wc -l | tr -d ' ') ficheiros"
      # A acção vai fixada pelo commit (o comentário diz a etiqueta): uma etiqueta pode mudar de
      # sítio, e esta corre com o token.
      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.145.0'
          command: deploy --config wrangler.json
